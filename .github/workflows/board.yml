# Keeps the Kanban project (github.com/users/streetlampsalad/projects/1) in step with Issues
# and pull requests (docs/agents/workflow.md). Agents never touch the board: cloud sessions
# cannot call GitHub's GraphQL API, so they change labels, assignees and pull requests, and
# this workflow moves the cards. A nightly run repairs anything an event missed.
name: Board

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review, converted_to_draft, closed]
  schedule:
    - cron: "17 14 * * *" # 01:17 in Sydney (AEDT)
  workflow_dispatch:

concurrency:
  group: board
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
      PROJECT_OWNER: streetlampsalad
      PROJECT_NUMBER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          # specs: the Feature Requests sync reads each spec's Ready to try section.
          sparse-checkout: |
            scripts/workflow
            specs

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # package.json names pnpm, which these jobs never install, so skip its cache.
          package-manager-cache: false

      - name: Sync the board
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::AUTOMATION_TOKEN is not set, so the board was not synced. Run scripts/setup-workflow.sh."
            exit 0
          fi
          node scripts/workflow/board-sync.mjs

      # Tells the app which stage each in-app Feature Request has reached (specs/124-feature-requests/).
      # Skips with a warning until scripts/setup-feature-requests.sh has set the secret.
      - name: Sync Feature Requests
        env:
          FEATURE_REQUESTS_SYNC_SECRET: ${{ secrets.FEATURE_REQUESTS_SYNC_SECRET }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::AUTOMATION_TOKEN is not set, so Feature Requests were not synced. Run scripts/setup-workflow.sh."
            exit 0
          fi
          node scripts/workflow/feature-requests-sync.mjs
