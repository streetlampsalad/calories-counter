# Starts the Dispatcher as soon as an Issue event gives it work, rather than at its next hourly
# run (docs/agents/dispatcher.md). scripts/workflow/dispatcher.mjs decides which events count.
name: Dispatcher

on:
  issues:
    types: [opened, labeled, unlabeled, closed]

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wake: ${{ steps.decide.outputs.wake }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/workflow

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # package.json names pnpm, which this job never installs, so skip its cache.
          package-manager-cache: false

      - id: decide
        run: node scripts/workflow/dispatcher-wake.mjs

  wake:
    needs: decide
    if: needs.decide.outputs.wake == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A burst of events, such as a Spec's Slices being created, starts one run: each new event
    # cancels the wait before it. The wait also lets the run that caused the burst claim its next
    # Issue first.
    concurrency:
      group: dispatcher-wake
      cancel-in-progress: true
    steps:
      - name: Wait for the burst to settle
        run: sleep 120

      - name: Start the Dispatcher
        env:
          FIRE_URL: ${{ vars.DISPATCHER_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.DISPATCHER_FIRE_TOKEN }}
          EVENT: issues.${{ github.event.action }} on #${{ github.event.issue.number }}
        run: |
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then
            echo "::warning::DISPATCHER_FIRE_URL or DISPATCHER_FIRE_TOKEN is not set, so the Dispatcher waits for its hourly run."
            exit 0
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $FIRE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg text "Woken by $EVENT" '{text: $text}')")"
          if [ "$status" != 200 ]; then
            echo "::warning::The Dispatcher did not start (HTTP $status), so it waits for its hourly run: $(cat response.json)"
            exit 0
          fi
          echo "Started the Dispatcher for $EVENT"
