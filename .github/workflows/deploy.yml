# Deploys production after CI passes on main (docs/adr/0007, spec 001).
# Order matters: migrations first, then the app, then a check that production serves this commit.
# Then the Issues it delivered close, which is what Done means on the board.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_CLI: vercel@65.0.0
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    # PRODUCTION_URL is the last value scripts/setup-production.sh sets, so an unconfigured
    # repository skips this job instead of failing it.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      # Deploys queue and can skip commits, so closing Issues walks back to the last success.
      - name: Find the previous production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          echo "PREVIOUS_SHA=$previous" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: |
          pnpm exec supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          pnpm exec supabase db push

      - name: Build for production
        run: |
          pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          # Vercel returns a [SENSITIVE] placeholder for variables marked sensitive. Public
          # NEXT_PUBLIC_* values are inlined at build time, so a placeholder would ship broken.
          if grep -qE '^NEXT_PUBLIC_[A-Z0-9_]+=.*\[SENSITIVE\]' .vercel/.env.production.local; then
            echo "::error::A NEXT_PUBLIC_* variable is stored as Sensitive in Vercel. Re-add it as a normal variable."
            exit 1
          fi
          pnpm dlx "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        run: pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --env COMMIT_SHA="$SHA" --token="$VERCEL_TOKEN"

      - name: Wait for production to serve this commit
        run: |
          url="${{ vars.PRODUCTION_URL }}/api/health"
          for attempt in $(seq 1 12); do
            body="$(curl --silent --show-error --max-time 10 "$url" || true)"
            echo "attempt $attempt: $body"
            if [ "$(echo "$body" | node -pe 'try{JSON.parse(require("fs").readFileSync(0,"utf8")).commit}catch{""}')" = "$SHA" ]; then
              echo "Production is serving $SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production did not report commit $SHA within 2 minutes"
          exit 1

      - name: Close the Issues now in production
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::AUTOMATION_TOKEN is not set, so delivered Issues stay open. Run scripts/setup-workflow.sh."
            exit 0
          fi
          node scripts/workflow/close-deployed.mjs "$SHA" "$PREVIOUS_SHA"

      # A production incident always gets a human (docs/adr/0007).
      - name: Open a P0 Bug
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Bug: Production deploy failed"
          existing="$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // ""')"
          body="The deploy of ${SHA} failed: ${RUN_URL}

          Migrations run before the app deploys, so check whether they were applied. Production keeps serving the previous deploy until this is fixed."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body" --label bug --label priority:P0 --label needs-human-review
          fi
