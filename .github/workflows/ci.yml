# The full gate (docs/adr/0007): every pull request into main must pass `pnpm validate` here.
name: CI

on:
  push:
    branches: [main]
  # Every change arrives as a pull request. deploy.yml only follows pushes to main.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Start local Supabase
        run: pnpm db:start

      - run: pnpm env:local

      - run: pnpm validate

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
