# The full gate (docs/adr/0007): every pull request into main must pass `pnpm validate` here, and
# so must every push to main, unless its pull request already tested exactly that tree.
name: CI

on:
  push:
    branches: [main]
  # Every change arrives as a pull request. deploy.yml only follows pushes to main.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces the run for the commit before it, which nothing waits
  # for any more. A run on main is never cancelled: deploy.yml follows every one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A push to main whose tree the merged pull request's CI already tested and passed skips the
  # second `pnpm validate`. If main moved in between, the tree differs and validate runs (#161).
  # `pnpm validate` is split over the static and e2e jobs so they run side by side; the validate
  # job, the required check on main, passes only when all of them did.
  reuse:
    if: github.event_name == 'push'
    # A failure here leaves no output, so validate runs; it must not fail CI and block the deploy.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/workflow

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # package.json names pnpm, which this job never installs, so skip its cache.
          package-manager-cache: false

      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: TREE="$(git rev-parse 'HEAD^{tree}')" node scripts/workflow/ci-reuse.mjs

  # lint, typecheck and unit tests: the steps of `pnpm validate:fast`, which need no database.
  static:
    needs: reuse
    # Runs unless the push reused a pull request's result; reuse is skipped for pull requests.
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm validate --fast

  # The rest of `pnpm validate`: the database checks, the build and the e2e tests, which are
  # shared between two machines. Each starts its own Supabase stack and runs the database checks.
  e2e:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let the other shard finish, so one run reports every failing test.
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: e2e (${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium installs while the stack's images download. The stack leaves out the services
      # the app does not use; `pnpm db:start` on a laptop still starts them all.
      - name: Start local Supabase and install Chromium
        run: |
          pnpm exec playwright install --with-deps chromium > "$RUNNER_TEMP/playwright-install.log" 2>&1 &
          install=$!
          pnpm exec supabase start --exclude studio,realtime,storage-api,imgproxy,edge-runtime,mailpit,logflare,vector,supavisor
          if ! wait "$install"; then
            cat "$RUNNER_TEMP/playwright-install.log"
            echo "::error::playwright install failed"
            exit 1
          fi

      - run: pnpm env:local

      # --fresh-db: starting the stack above applied every migration and the seed to an empty
      # database, which is what `pnpm db:reset` would do again.
      - run: pnpm validate --no-static --fresh-db --shard=${{ matrix.shard }}/2

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  validate:
    needs: [reuse, static, e2e]
    # always(): a cancelled or failed job must fail this check, because a skipped run of a required
    # check counts as passing. Skipped only when the push reused a pull request's result.
    if: ${{ always() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of pnpm validate passed
        env:
          STATIC: ${{ needs.static.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "static: $STATIC, e2e: $E2E"
          if [ "$STATIC" != "success" ] || [ "$E2E" != "success" ]; then
            echo "::error::pnpm validate did not pass (static: $STATIC, e2e: $E2E). See those jobs."
            exit 1
          fi

      # A pull request's checkout is its merge with main, so this is the tree a push can reuse.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v5

      - name: Record the tree this pull request tested
        if: github.event_name == 'pull_request'
        id: tree
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "$tree" > tested-tree.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 30
