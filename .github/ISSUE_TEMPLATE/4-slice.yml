name: Spec slice
description: One row of a spec's Issue breakdown (docs/specs).
title: "[NNN] "
labels: []
body:
  - type: input
    id: spec
    attributes:
      label: Spec
      description: Link to the spec file, e.g. docs/specs/008-daily-logging.md
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria covered
      description: Copy each criterion verbatim from the spec (AC-n). Each one needs a test.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Slice-specific design notes, human steps, or "Blocked by #…".
  - type: checkboxes
    id: done
    attributes:
      label: Definition of done
      options:
        - label: Every listed criterion has a test that fails without the change
        - label: "`pnpm validate` passes locally and in CI"
        - label: CONTEXT.md and ADRs updated if the language or a decision changed
