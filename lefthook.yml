# Trunk-based development (docs/adr/0003): these hooks are the gate before main.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,mjs,ts,tsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm typecheck

pre-push:
  jobs:
    - name: validate
      run: pnpm validate
